<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- La hoja de estilos siempre la enlazamos en el head con el rel de stylesheet -->
    <link rel="stylesheet" href="ejemplo.css">

    <!--
        Cascada Style Sheets -
        va en cascada, es decir, si hay dos estilos que se aplican a un mismo elemento,
        el último estilo que se aplique será el que se vea reflejado en la página.
    -->
    <title>Aprendiendo CSS</title>
    <!-- <style>
        body {
            background-color: tomato;
        }
    </style> -->
</head>
<body>
    <!-- Podemos reutilizar las clases -->
    <h1>Aprendiendo CSS</h1>
    <!-- Aplicamos la clase con el atributo class-->
    <p id="voldemort" class="blanco">Soy un párrafo</p>
</body>
</html>
