<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Listas en HTML</h1>

    <h2>Lista ordenadas</h2>
    <!-- ol: ordered list (lista ordenada) -->
    <ol>
        <!-- li: list item  -->
        <li>Primer paso</li>
        <li>Segundo paso</li>
        <li>Tercer paso</li>
    </ol>
    
    <h2>Lista desordenadas</h2>
    <!-- ul: unordered list (lista desordenada) -->
    <ul>
        <!-- La etiqueta interna es la misma  -->
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>

    <h2>Barra de navegación</h2>
    
    <nav>
        <ul>
            <!-- El archivo index.html se utiliza de manera predeterminada para saber que eso es "la home" 
            Si ingreso a mi sitio web, por defecto se cargará este archivo -->
            <li><a href="index.html">Ir al inicio</a></li>
            <li><a href="ejemplo.html">Nosotros</a></li>
        </ul>
    </nav>
</body>
</html>
