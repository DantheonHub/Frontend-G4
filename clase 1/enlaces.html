<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>
    <h1>Enlaces</h1>

    <!-- Crear un enlace a ejemplo.html -->
    <a href="ejemplo.html">Ir a Ejemplo</a>

    <!-- Archivos internos 
        Imagen
            src: source (fuente)
            alt: texto alternativo y descriptivo que sirve para que los buscadores puedan indexar la imagen y para personas con discapacidad visual que utilizan lectores de pantalla.
    -->
    <img src="img/Personajebase.png" alt="Personaje base">

    <!-- 
        Enlaces
        - Relativos
            Internos (PersonajeBase!)
                si esta en la misma carpeta:
                | nombre_de_archivo.extension
                si esta dentro de otra carpeta:
                | nombre_de_carpeta/nombre_de_archivo.extension
        - Absolutos
            Externos 
            | Externos (link a internet)
            | https://google.com (siempre va con protocolo HTTP o HTTPS)
            Si queremos que abra en nueva pestaña agregamos 
            el atributo target="_blank"
    -->  
    <!--
        a: Anchor (ancla)
        href: Hypertext REFerence (referencia de hipertexto) [adonde apunta el enlace]
    -->
    <a href="https://www.google.com" target="_blank">Ir a Google</a>

</body>
</html>
